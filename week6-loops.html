<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const W=1600,H=900;
const C={bg:"#0e1116",blue:"#58C4DD",gold:"#F0AC5F",brown:"#8C6B4F",tan:"#D8C3A5",green:"#83C167",red:"#FC6255",teal:"#5CD0B3",purple:"#C792EA",yellow:"#FFE38A",white:"#ECE6DA",muted:"#9aa3ad"};
const MONO="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace";
const SERIF="'Newsreader', Georgia, 'Times New Roman', serif";
const SYN={kw:C.purple,fn:C.blue,num:C.gold,str:C.green,p:C.white,var:C.yellow,out:C.teal,err:C.red};
/* ---------- tiny helpers ---------- */
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function tx(parent,x,y,s,o){const t=el("text",Object.assign({x,y,fill:C.white,"font-family":SERIF,"font-size":32},o||{}),parent);t.textContent=s;return t;}
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const P=(t,a,b)=>ease(lin(t,a,b));
const lerp=(a,b,p)=>a+(b-a)*p;
function backOut(p){if(p<=0)return 0;if(p>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
function op(e,v){e.setAttribute("opacity",clamp(v).toFixed(3));}
function tf(e,x,y,s,r){let str=`translate(${x.toFixed(1)},${y.toFixed(1)})`;if(s!==undefined&&s!==1)str+=` scale(${Math.max(0,s).toFixed(3)})`;if(r)str+=` rotate(${r.toFixed(1)})`;e.setAttribute("transform",str);}
function overlap(t,runs){let s=0;runs.forEach(([a,b])=>{s+=clamp(t-a,0,b-a);});return s;}
function inRuns(t,runs){return runs.some(([a,b])=>t>=a&&t<b);}

/* ---------- drawing kit ---------- */
function code(parent,x,y,lines,size){
  size=size||36;const g=el("g",{},parent);const lh=size*1.45;const spans=[];let total=0;
  lines.forEach((line,i)=>{
    const t=el("text",{x,y:y+i*lh,"font-family":MONO,"font-size":size,style:"white-space:pre"},g);
    line.forEach(([s,c])=>{const sp=el("tspan",{fill:SYN[c]||c},t);spans.push({sp,s,start:total});total+=s.length;});
    total+=1;
  });
  return {g,total,reveal(n){n=Math.floor(n);spans.forEach(o=>{o.sp.textContent=o.s.slice(0,clamp(n-o.start,0,o.s.length));});}};
}
function codeLine(p,x,y,toks,fs,anchor){const t=el("text",{x,y,"font-family":MONO,"font-size":fs||30,"text-anchor":anchor||"start",style:"white-space:pre"},p);toks.forEach(([s,c])=>{const sp=el("tspan",{fill:SYN[c]||c},t);sp.textContent=s;});return t;}
function token(parent,label,color,kind,r){
  r=r||40;const g=el("g",{},parent);const fs=kind==="str"?r*.7:r*.85;
  if(kind==="str"){const w=Math.max(r*2,label.length*fs*.62+36);el("rect",{x:-w/2,y:-r,width:w,height:r*2,rx:r,fill:color,"fill-opacity":.14,stroke:color,"stroke-width":3.5,filter:"url(#glow)"},g);g.halfW=w/2;}
  else{el("circle",{r,fill:color,"fill-opacity":.14,stroke:color,"stroke-width":3.5,filter:"url(#glow)"},g);g.halfW=r;}
  tx(g,0,2,label,{"text-anchor":"middle","dominant-baseline":"central","font-family":MONO,"font-size":fs,fill:color,"font-weight":700});
  op(g,0);return g;
}
function nameTag(parent,name){
  const g=el("g",{},parent);const fs=32;const w=name.length*fs*.62+44;
  el("path",{d:`M0 -28 H${w} L${w+26} 0 L${w} 28 H0 Z`,fill:"#241c14",stroke:C.tan,"stroke-width":3,"stroke-linejoin":"round"},g);
  el("circle",{cx:w+4,cy:0,r:6,fill:C.bg,stroke:C.tan,"stroke-width":2},g);
  tx(g,w/2,2,name,{"text-anchor":"middle","dominant-baseline":"central","font-family":MONO,"font-size":fs,fill:C.yellow});
  g.hole=w+4;op(g,0);return g;
}
function rope(parent){
  const p=el("path",{fill:"none",stroke:C.tan,"stroke-width":3,"stroke-linecap":"round",pathLength:1,"stroke-dasharray":"1 1"},parent);
  return {el:p,set(ax,ay,bx,by,draw,sag){sag=sag===undefined?40:sag;const dx=bx-ax;
    p.setAttribute("d",`M${ax.toFixed(1)} ${ay.toFixed(1)} C${(ax+dx*.35).toFixed(1)} ${(ay+sag).toFixed(1)} ${(bx-dx*.35).toFixed(1)} ${(by+sag).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`);
    p.setAttribute("stroke-dashoffset",(1-draw).toFixed(3));op(p,draw>0.001?1:0);}};
}
function cube(p,x,y,s,color){s=s||46;color=color||C.gold;const g=el("g",{},p);
  el("rect",{x:0,y:0,width:s,height:s,rx:5,fill:color,"fill-opacity":.18,stroke:color,"stroke-width":3},g);
  el("line",{x1:7,y1:8,x2:s-12,y2:8,stroke:color,"stroke-opacity":.6,"stroke-width":2,"stroke-linecap":"round"},g);
  tf(g,x,y);return g;}
function gearPath(r,n){const ri=r*.8,s=2*Math.PI/n;const pts=[];for(let i=0;i<n;i++){const a=i*s;pts.push([ri,a],[r,a+s*.15],[r,a+s*.45],[ri,a+s*.6]);}
  return "M"+pts.map(([rr,a])=>`${(rr*Math.cos(a)).toFixed(1)} ${(rr*Math.sin(a)).toFixed(1)}`).join(" L")+" Z";}
function gear(p,r,n,color){const g=el("g",{},p);el("path",{d:gearPath(r,n),fill:"#1c222c",stroke:color,"stroke-width":3,"stroke-linejoin":"round"},g);el("circle",{r:r*.28,fill:"none",stroke:color,"stroke-width":3},g);return g;}
function belt(p,x1,x2,y){const g=el("g",{},p);
  el("rect",{x:x1,y,width:x2-x1,height:16,rx:8,fill:"#1a1f27",stroke:"#3a424f","stroke-width":2},g);
  const l=el("line",{x1:x1+8,x2:x2-8,y1:y+8,y2:y+8,stroke:"#4b5563","stroke-width":3,"stroke-dasharray":"14 12"},g);
  return {g,update(t){l.setAttribute("stroke-dashoffset",(-t*50).toFixed(1));}};}
function factory(p,name,param,color){
  const g=el("g",{},p);
  const smoke=[0,1,2,3].map(()=>el("circle",{fill:"#8a94a3"},g));
  el("rect",{x:330,y:-118,width:44,height:90,fill:"#1a1f27",stroke:C.brown,"stroke-width":3},g);
  let d="M0 0";for(let i=0;i<4;i++){const x=i*105;d+=` L${x} -45 L${x+105} 0`;}d+=" Z";
  el("path",{d,fill:"#1a1f27",stroke:C.brown,"stroke-width":3,"stroke-linejoin":"round"},g);
  el("path",{d:"M28 -122 L132 -122 L102 -30 L58 -30 Z",fill:"#20262f",stroke:color,"stroke-width":3,"stroke-linejoin":"round"},g);
  tx(g,80,-82,param,{"text-anchor":"middle","dominant-baseline":"central","font-family":MONO,"font-size":param.length>2?24:30,fill:C.yellow});
  el("rect",{x:0,y:0,width:420,height:260,rx:6,fill:"#151a21",stroke:C.brown,"stroke-width":4},g);
  el("rect",{x:420,y:192,width:62,height:60,fill:"#151a21",stroke:C.brown,"stroke-width":4},g);
  tx(g,451,180,"return",{"text-anchor":"middle","font-style":"italic","font-size":22,fill:C.muted});
  el("rect",{x:36,y:24,width:348,height:92,rx:10,fill:"#07090c",stroke:color,"stroke-width":2},g);
  const disp=tx(g,210,72,"",{"text-anchor":"middle","dominant-baseline":"central","font-family":MONO,"font-size":30,fill:color});
  const g1=gear(g,48,12,color),g2=gear(g,36,9,C.gold),g3=gear(g,28,8,color);
  const light=el("circle",{cx:394,cy:150,r:9},g);
  return {g,update(t,running,ang,text,tc){
    tf(g1,130,190,1,ang);tf(g2,206,190,1,-ang*48/36+10);tf(g3,264,190,1,ang*48/28);
    light.setAttribute("fill",running?C.green:"#5a2a2a");
    disp.textContent=text;disp.setAttribute("fill",tc||color);
    smoke.forEach((c,i)=>{const ph=(t*.45+i/4)%1;c.setAttribute("cx",(352+14*Math.sin(ph*6+i)).toFixed(1));c.setAttribute("cy",(-128-ph*110).toFixed(1));
      c.setAttribute("r",(9+18*ph).toFixed(1));op(c,(1-ph)*(running?.5:.25));});
  }};
}
function feedPos(p,sx,sy,hx,hy){
  if(p<.4){const q=ease(p/.4);return [lerp(sx,hx-200,q),sy,1,1];}
  if(p<.8){const q=ease((p-.4)/.4);const x0=hx-200,y0=sy,cx=hx-120,cy=hy-170,ex=hx,ey=hy-30;
    return [(1-q)*(1-q)*x0+2*(1-q)*q*cx+q*q*ex,(1-q)*(1-q)*y0+2*(1-q)*q*cy+q*q*ey,1,1];}
  const q=ease((p-.8)/.2);return [hx,lerp(hy-30,hy+60,q),1-.6*q,1-q];
}
function chapter(g,num,name,sub){
  const big=el("g",{},g);
  tx(big,0,-100,num,{"text-anchor":"middle","font-size":38,"font-style":"italic",fill:C.blue});
  const line=el("line",{y1:-70,y2:-70,stroke:C.blue,"stroke-width":2},big);
  tx(big,0,20,name,{"text-anchor":"middle","font-size":116,"font-weight":600});
  tx(big,0,88,sub,{"text-anchor":"middle","font-size":38,"font-style":"italic",fill:C.muted});
  const small=el("g",{},g);
  tx(small,70,92,num,{"font-size":34,"font-style":"italic",fill:C.blue});
  tx(small,104,92,name,{"font-size":34,"font-style":"italic",fill:C.muted});
  return t=>{const a=P(t,0,.8),b=P(t,2.2,3);op(big,a*(1-b));tf(big,800,430-b*60,1-.15*b);op(small,b);
    line.setAttribute("x1",(-150*a).toFixed(1));line.setAttribute("x2",(150*a).toFixed(1));};
}

/* ---------- extra kit ---------- */
function spanSet(parts,n){let k=0;parts.forEach(([sp,s])=>{sp.textContent=s.slice(0,clamp(n-k,0,s.length));k+=s.length;});}
function hlRect(p,x0,y,fs,a,b,color){const cw=fs*.6;const r=el("rect",{x:x0+a*cw-4,y:y-fs*.9,width:(b-a)*cw+8,height:fs*1.25,rx:7,fill:color,"fill-opacity":.16,stroke:color,"stroke-opacity":.7,"stroke-width":1.5},p);op(r,0);return r;}
function phone(p,title){const g=el("g",{},p);
  el("rect",{x:0,y:0,width:380,height:600,rx:44,fill:"#0b0e12",stroke:"#3a424f","stroke-width":4},g);
  el("rect",{x:150,y:18,width:80,height:10,rx:5,fill:"#2a313b"},g);
  tx(g,32,82,title,{"font-size":30,"font-weight":600});
  el("line",{x1:30,x2:350,y1:104,y2:104,stroke:"#262c35","stroke-width":2},g);return g;}
function bubble(p,text,color){const g=el("g",{},p);const w=text.length*10.6+36;
  el("rect",{x:0,y:-26,width:w,height:52,rx:14,fill:color,"fill-opacity":.12,stroke:color,"stroke-width":2},g);
  tx(g,18,1,text,{"dominant-baseline":"central","font-size":23});g.w=w;op(g,0);return g;}
function chip(p,x,y,text,color){const g=el("g",{},p);const w=text.length*14.4+32;
  el("rect",{x,y:y-30,width:w,height:44,rx:22,fill:color,"fill-opacity":.12,stroke:color,"stroke-width":2},g);
  tx(g,x+16,y,text,{"font-family":MONO,"font-size":24,fill:color});op(g,0);return g;}
function blankTag(p,w){const g=el("g",{},p);
  el("path",{d:`M0 -28 H${w} L${w+26} 0 L${w} 28 H0 Z`,fill:"#15191f",stroke:C.tan,"stroke-width":2.5,"stroke-dasharray":"8 7","stroke-linejoin":"round"},g);
  tx(g,w/2,2,"?",{"text-anchor":"middle","dominant-baseline":"central","font-family":MONO,"font-size":32,fill:C.yellow});g.hole=w+4;return g;}
function numberLine(p,x0,y,ppk,max){const g=el("g",{},p);
  el("line",{x1:x0-10,x2:x0+ppk*max+20,y1:y,y2:y,stroke:C.muted,"stroke-width":2.5},g);
  for(let k=0;k<=max;k++){el("line",{x1:x0+k*ppk,x2:x0+k*ppk,y1:y-9,y2:y+9,stroke:C.muted,"stroke-width":2},g);
    tx(g,x0+k*ppk,y+38,String(k),{"text-anchor":"middle","font-family":MONO,"font-size":22,fill:C.muted});}
  tx(g,x0+ppk*max+34,y+7,"km",{"font-family":MONO,"font-size":22,fill:C.muted});return g;}
function shakeX(t,a){return t>a?10*Math.sin((t-a)*40)*(1-lin(t,a,a+.7)):0;}

/* ---------- episode 2 kit ---------- */
function machine(p,o){
  const w=o.w||520,color=o.color||C.blue,g=el("g",{},p);
  const smoke=[0,1,2,3].map(()=>el("circle",{fill:"#8a94a3"},g));
  const chx=o.params.length===2?w/2-22:w-110;
  el("rect",{x:chx,y:-118,width:44,height:90,fill:"#1a1f27",stroke:C.brown,"stroke-width":3},g);
  const n=Math.max(2,Math.round(w/105)),tw=w/n;let d="M0 0";for(let i=0;i<n;i++){const x=i*tw;d+=` L${x.toFixed(1)} -45 L${(x+tw).toFixed(1)} 0`;}d+=" Z";
  el("path",{d,fill:"#1a1f27",stroke:C.brown,"stroke-width":3,"stroke-linejoin":"round"},g);
  const cxs=o.params.length===2?[w*.17,w*.77]:[w*.2];
  const hoppers=o.params.map((pn,i)=>{const cx=cxs[i];
    const h=el("path",{d:`M${cx-52} -122 L${cx+52} -122 L${cx+22} -30 L${cx-22} -30 Z`,fill:"#20262f",stroke:color,"stroke-width":3,"stroke-linejoin":"round"},g);
    if(o.labels!==false)tx(g,cx,-140,pn,{"text-anchor":"middle","font-family":MONO,"font-size":o.lfs||24,fill:C.yellow});
    return h;});

  while(audioCueIndex+1<narrationTimeline.length&&t>=narrationTimeline[audioCueIndex+1].playStart)audioCueIndex++;
  while(audioCueIndex>0&&t<narrationTimeline[audioCueIndex].playStart)audioCueIndex--;
  return narrationTimeline[audioCueIndex];
}
function seekNarrationToVisual(t){
  if(!narrationAudio||!narrationTimeline.length)return;
  const entry=visualEntryAt(t),span=Math.max(.001,entry.visualEnd-entry.visualStart);
  const progress=clamp((t-entry.visualStart)/span);
  const target=progress<.0001?entry.playStart:lerp(entry.audioStart,entry.audioEnd,progress);
  pauseNarration();try{narrationAudio.currentTime=target;}catch(_){}
  audioCueIndex=entry.index;lastAudioTime=target;narrationSynced=true;
}
function playNarration(){
  if(!narrate||!narrationAudio||!playing)return;
  if(!narrationSynced)seekNarrationToVisual(now);
  narrationDriving=true;const promise=narrationAudio.play();
  if(promise)promise.catch(()=>{narrationDriving=false;});
}
function finishNarratedPlayback(){pauseNarration();now=total;playing=false;narrationSynced=true;render();setPlayUI();}
function syncVisualToNarration(){
  const current=narrationAudio.currentTime;
  if(stopBeats){const crossed=narrationTimeline.find(entry=>entry.visualEnd<total&&entry.audioEnd>lastAudioTime+.001&&entry.audioEnd<=current&&Math.abs(entry.visualEnd-heldAt)>1e-6);
    if(crossed){narrationAudio.pause();try{narrationAudio.currentTime=crossed.audioEnd;}catch(_){}audioCueIndex=crossed.index;lastAudioTime=crossed.audioEnd;narrationSynced=true;narrationDriving=false;now=crossed.visualEnd-.001;heldAt=crossed.visualEnd;playing=false;render();setPlayUI();return false;}}
  const entry=audioEntryAt(current),span=Math.max(.001,entry.audioEnd-entry.audioStart);
  const progress=clamp((current-entry.audioStart)/span);now=lerp(entry.visualStart,entry.visualEnd-.001,progress);lastAudioTime=current;
  if(entry.index===narrationTimeline.length-1&&current>=entry.audioEnd){finishNarratedPlayback();return false;}
  render();return true;
}

const chapBtns=scenes.map((s,i)=>{const b=document.createElement("button");b.innerHTML=`<span class="n">${i===0?"▸":i===scenes.length-1?"✦":i}</span>${s.name}`;
  b.addEventListener("click",()=>seek(offs[i]));chapNav.appendChild(b);return b;});
scenes.forEach((s,i)=>{if(i===0)return;const d=document.createElement("div");d.className="tick";d.style.left=(offs[i]/total*100)+"%";scrub.querySelector(".track").appendChild(d);});
scrub.setAttribute("aria-valuemax",String(Math.round(total)));

function render(){
  const tt=Math.min(now,total-1e-4);const i=sceneAt(tt);
  if(i!==cur){cur=i;while(layer.firstChild)layer.removeChild(layer.firstChild);const g=el("g",{},layer);upd=scenes[i].build(g);
    chapBtns.forEach((b,j)=>b.setAttribute("aria-current",j===i?"true":"false"));}
  const lt=tt-offs[i];upd(lt);
  const bs=scenes[i].beats;let k=0;for(let j=0;j<bs.length;j++)if(lt>=bs[j][0])k=j;
  const key=i+":"+k;
  if(key!==beatKey){beatKey=key;cueNow.textContent=bs[k][1];
    const nxt=k+1<bs.length?bs[k+1][1]:(scenes[i+1]?scenes[i+1].beats[0][1]:"End of episode.");cueNext.textContent="Next: "+nxt;}
  const pct=now/total*100;fill.style.width=pct+"%";knob.style.left=pct+"%";
  timeEl.textContent=fmt(now)+" / "+fmt(total);scrub.setAttribute("aria-valuenow",String(Math.round(now)));
}
function setState(){
  cueState.textContent=(!playing&&stopBeats&&heldAt>0&&Math.abs(now-heldAt)<.01)?"Held at the end of this beat. Press Space to continue.":"";
}
function setPlayUI(){playBtn.innerHTML=playing?ICON_PAUSE:(now>=total?ICON_REPLAY:ICON_PLAY);playBtn.setAttribute("aria-label",playing?"Pause":"Play");setState();}
function setNarrUI(){narrBtn.textContent=narrate?"Narration: on":"Narration: off";narrBtn.setAttribute("aria-pressed",String(narrate));
  speedBtn.setAttribute("aria-label",narrate?"Animation speed when narration is off":"Animation speed");
  speedBtn.title=narrate?"Narration is the timing master; this speed applies when narration is off.":"Animation playback speed";
  if(!narration){narrBtn.disabled=true;narrBtn.textContent="Narration unavailable";}}
function tick(ts){
  if(!playing){lastTs=null;return;}
  if(narrate&&narrationAudio&&narrationDriving){lastTs=ts;if(syncVisualToNarration()&&playing)requestAnimationFrame(tick);return;}
  if(lastTs==null)lastTs=ts;const dt=Math.min(.1,(ts-lastTs)/1000)*speed;lastTs=ts;
  let next=now+dt;
  if(stopBeats){const nb=nextBoundary(now);if(next>=nb&&nb<total&&Math.abs(nb-heldAt)>1e-6){now=nb-.001;heldAt=nb;playing=false;pauseNarration();render();setPlayUI();return;}}
  now=next;
  if(now>=total){now=total;playing=false;stopNarration(true);setPlayUI();}
  render();
  if(playing)requestAnimationFrame(tick);
}
function play(){
  if(!started){started=true;bigplay.style.display="none";now=0;cur=-1;beatKey=null;}
  if(now>=total){now=0;beatKey=null;narrationSynced=false;}
  playing=true;render();if(narrate)playNarration();setPlayUI();lastTs=null;requestAnimationFrame(tick);
}
function pause(){playing=false;pauseNarration();setPlayUI();}
function seek(t){if(!started){started=true;bigplay.style.display="none";}now=clamp(t,0,total);heldAt=-1;beatKey=null;render();if(narrate){seekNarrationToVisual(now);if(playing)playNarration();}else narrationSynced=false;setPlayUI();}

playBtn.addEventListener("click",()=>playing?pause():play());
bigplay.addEventListener("click",play);
speedBtn.addEventListener("click",()=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];speedBtn.textContent=speed+"×";});
narrBtn.addEventListener("click",()=>{narrate=!narrate;if(!narrate)stopNarration(true);else{narrationSynced=false;if(playing)playNarration();}setNarrUI();});
stopBtn.addEventListener("click",()=>{stopBeats=!stopBeats;stopBtn.setAttribute("aria-pressed",String(stopBeats));stopBtn.textContent=stopBeats?"Stop at each beat: on":"Stop at each beat: off";setState();});
cuesBtn.addEventListener("click",()=>{cuesOn=!cuesOn;cuesBtn.setAttribute("aria-pressed",String(cuesOn));cuesBtn.textContent=cuesOn?"Cues: on":"Cues: off";cuesEl.hidden=!cuesOn;});
$("fs").addEventListener("click",()=>{const s=$("stage");try{if(document.fullscreenElement)document.exitFullscreen();else if(s.requestFullscreen)s.requestFullscreen();}catch(e){}});
let dragging=false;
function fromEvent(e){const r=scrub.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width)*total;}
scrub.addEventListener("pointerdown",e=>{dragging=true;try{scrub.setPointerCapture(e.pointerId);}catch(_){}seek(fromEvent(e));});
scrub.addEventListener("pointermove",e=>{if(dragging)seek(fromEvent(e));});
scrub.addEventListener("pointerup",()=>{dragging=false;});
document.addEventListener("keydown",e=>{const tag=(e.target.tagName||"").toLowerCase();if(tag==="button"||tag==="summary")return;
  if(e.code==="Space"||e.key==="k"){e.preventDefault();playing?pause():play();}
  else if(e.key==="ArrowRight"){e.preventDefault();seek(now+5);}else if(e.key==="ArrowLeft"){e.preventDefault();seek(now-5);}
  else if(e.key==="Home"){e.preventDefault();seek(0);}});

/* poster frame */
now=9.6;render();now=0;cueNow.textContent=scenes[0].beats[0][1];cueNext.textContent="Next: "+scenes[0].beats[1][1];
fill.style.width="0%";knob.style.left="0%";timeEl.textContent=fmt(0)+" / "+fmt(total);
setPlayUI();setNarrUI();
})();
</script>
</body>
